<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo</title>
    <link rel="stylesheet" href="./assts/css/style.css">
</head>

<body>
    <section class="container">
        <h1> Tabela IMC</h1>

       <div id="conteudo-imc">

        <div id="tabela">
             <p>
                Menor que 18,5 - Abaixo do peso <br>
                Entre 18,5 e 24,9 - Peso normal <br>
                Entre 25 e 29,9 - Sobrepeso <br>
                Entre 30 e 34,9 - Obesidade grau 1 <br>
                Entre 35 e 39,9 - Obesidade grau 2 <br>
                Maior que 40 - Obesidade grau 3 <br>
            </p>
        </div>

        <div id="calculadora">
        <form id="formulario">
            <label for="peso">Peso</label>
            <input autocomplete="off" required type="text" id="peso">

            <label for="altura">Altura</label>
            <input autocomplete="off" required type="text" id="altura">
            

            <button>Calcular</button>
        </form>

        <div id="resultado"></div>
        </div>

    </section>
</body>
<script src="./assts/js/main.js"></script>

</html>
