<!DOCTYPE html>

    <title>Treinamento</title>
    <link rel="stylesheet" href="assets\css\style.css">
    <script src="assets\js\script.js" defer></script>
</head>
<body>
<div class="container">

    <div class="content"> 
        <h1>Minhas tarefas</h1>
    </div>
    

    <div class="input-group">
        <input type="text" id="tarefaInput" placeholder="Digite uma tarefa">
        <button id="adicionar-tarefa">Adicionar Tarefa</button>
    </div>
    
    <ul id="lista-tarefas"></ul>

<div id="contador-tarefas">
    <div class="tarefas-concluidas">
        <h2>0</h2>
        <p><strong>Tarefas concluídas</strong></p>
    </div>

    <div class="tarefas-pendentes">
        <h2>0</h2>
        <p><strong>Tarefas pendentes</strong></p>
    </div>
</div>

</div>
