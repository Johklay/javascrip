<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#081426">
    <title>Buscador de repositórios do GitHub</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <p class="eyebrow">Explore o GitHub</p>
        <h1>Encontre seu próximo repositório favorito</h1>
        <p class="intro">Pesquise repositórios públicos ordenados pelas estrelas.</p>
      </header>

      <section class="search-card" aria-label="Busca de repositórios">
        <form id="search-form" role="search">
          <label for="search-input">O que você quer encontrar?</label>
          <div class="search-control">
            <input
              id="search-input"
              name="query"
              type="search"
              placeholder="Ex.: javascript, react, machine learning"
              autocomplete="off"
              required
            >
            <button id="search-submit" class="search-hint" type="submit" aria-label="Buscar repositórios">
              Enter ↵
            </button>
          </div>
        </form>
      </section>

      <p id="search-status" class="search-status" role="status" aria-live="polite"></p>

      <section id="results-card" class="results-card" aria-label="Resultados da busca" hidden>
        <div class="results-heading">
          <h2>Repositórios</h2>
          <span id="results-count" class="results-count"></span>
        </div>
        <ul id="results-list" class="results-list"></ul>
      </section>
    </main>
  </body>
</html>
